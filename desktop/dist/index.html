<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexion</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --card: #111a2e;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --border: #1e293b;
          --accent: #3b82f6;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .card {
        width: min(460px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 36px 32px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>No se pudo conectar</h1>
      <p>
        La aplicacion necesita conexion a internet porque los datos y los
        archivos viven en el servidor.
      </p>
      <p>Revisa tu conexion y vuelve a intentarlo.</p>
      <button id="retry" type="button">Reintentar</button>
      <div class="status" id="status"></div>
    </main>
    <script>
      // Debe coincidir con APP_URL en src-tauri/src/lib.rs
      var APP_URL = "https://clinicajuridica.vercel.app";
      var boton = document.getElementById("retry");
      var estado = document.getElementById("status");

      boton.addEventListener("click", function () {
        boton.disabled = true;
        estado.textContent = "Conectando...";
        // on_navigation permite este host, asi que carga la app en esta ventana.
        window.location.assign(APP_URL);
        setTimeout(function () {
          boton.disabled = false;
          estado.textContent = "Sigue sin haber conexion.";
        }, 6000);
      });
    </script>
  </body>
</html>
