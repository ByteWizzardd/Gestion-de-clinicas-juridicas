services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica_juridica_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Misma zona que la BD: pg convierte DATE/TIMESTAMP con la zona del proceso
      - TZ=America/Caracas
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/gestion_clinicas}
      # Sin valor por defecto a proposito: un secreto de respaldo escrito en
      # el repositorio equivale a no tener secreto. ':?' aborta el arranque.
      - JWT_SECRET=${JWT_SECRET:?definelo en .env, minimo 32 caracteres}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-12h}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CITA_REMINDER_DAYS_AHEAD=${CITA_REMINDER_DAYS_AHEAD:-1}
      - NOTIFICATIONS_TTL_DAYS=${NOTIFICATIONS_TTL_DAYS:-30}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-}
      # Vacio = puerta abierta. Solo tiene sentido si esta instalacion se usa
      # desde la app de escritorio (ver desktop/README.md).
      - DESKTOP_APP_TOKEN=${DESKTOP_APP_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinica_network

  db:
    image: postgres:16-alpine
    container_name: clinica_juridica_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_clinicas}
      TZ: "America/Caracas"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gestion_clinicas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clinica_network

volumes:
  postgres_data:
    driver: local

networks:
  clinica_network:
    driver: bridge

